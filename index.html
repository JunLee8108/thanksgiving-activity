<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#FBF4E9; --bg2:#F3E4CE; --card:#FFFCF6; --ink:#2B1A10; --ink2:#6B5644; --ink3:#A08D7A;
  --line:#E8D8C2; --pumpkin:#E0661B; --pumpkin-d:#B84E0F; --pumpkin-l:#FFEFE2;
  --cran:#9E2A2B; --gold:#E9A23B; --gold-l:#FFF4DC; --sage:#6F7F4F; --sage-l:#EDF1E4;
  --radius:20px; --shadow:0 1px 0 rgba(43,26,16,.04), 0 10px 28px -14px rgba(43,26,16,.28);
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;background:
  radial-gradient(120% 60% at 100% 0%, #F7DFC2 0%, transparent 55%),
  radial-gradient(90% 50% at 0% 100%, #F1E2CC 0%, transparent 60%), var(--bg);
  background-attachment:fixed}
.display{font-family:'Jua',Pretendard,sans-serif;font-weight:400;letter-spacing:-.01em}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px calc(170px + env(safe-area-inset-bottom))}
.home.wrap{padding-bottom:40px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
[hidden]{display:none!important}
/* 이모지 대신 쓰는 SVG: 글자 크기(font-size)를 따라간다 */
.emo{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex-shrink:0}
.ic{flex-shrink:0;vertical-align:-.2em}
.hero-emoji .emo,.big-emoji .emo,.pick-emoji .emo,.drum .emo,.crown .emo,.float .emo{display:block}
.crown .emo{margin:0 auto}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:50px;padding:0 18px;border-radius:14px;
  font-weight:700;font-size:16px;background:var(--pumpkin);color:#fff;transition:transform .08s,filter .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.dark{background:var(--ink);color:#fff}
.btn.cran{background:var(--cran)}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.xs{height:30px;padding:0 10px;font-size:13px;border-radius:9px}
.btn.danger{background:transparent;color:var(--cran);border:1.5px solid #E9C7C3}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--card);border:1.5px solid var(--line)}

/* Forms */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
input,textarea{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);outline:none;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--pumpkin)}
textarea{resize:vertical;line-height:1.5}
label.f{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:16px 0 7px}
.hint{font-size:12px;color:var(--ink3);margin-top:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border-radius:13px;padding:4px;margin-bottom:4px}
.seg button{height:40px;border-radius:10px;font-weight:700;color:var(--ink2);transition:background .15s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(43,26,16,.12)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emoji-grid button{display:grid;place-items:center;aspect-ratio:1;border-radius:10px;font-size:22px;background:var(--bg);border:1.5px solid transparent;transition:transform .1s}
.emoji-grid button.on{border-color:var(--pumpkin);background:var(--pumpkin-l);transform:scale(1.06)}
.form-submit{margin-top:22px}

/* Home */
.hero{text-align:center;padding:28px 0 22px}
.hero-emoji{font-size:72px;line-height:1;display:inline-block;animation:bob 3s ease-in-out infinite}
.hero h1{font-size:30px;margin:12px 0 6px}
.hero p{margin:0;color:var(--ink2);line-height:1.55}
.back-link{display:block;text-align:center;margin-top:16px;color:var(--ink2);font-size:14px;text-decoration:underline}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.room-name{font-size:22px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:13px;font-weight:700}
.chip.code{letter-spacing:.08em}
.chip.host{background:var(--gold-l);border-color:#F1D9A6;color:#8A5A12}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sage);display:inline-block}
.dot.off{background:#CDBFAF}

/* Stage */
.q-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.q-label{font-weight:800;color:var(--pumpkin);font-size:15px}
.q-label em{font-style:normal;color:var(--ink3);font-weight:600}
.pill{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px}
.pill.open{background:var(--sage-l);color:var(--sage)}
.pill.closed{background:var(--bg2);color:var(--ink2)}
.pill.revealed{background:var(--gold-l);color:#8A5A12}
.pill.draft{background:#F1ECE6;color:var(--ink3)}
.q-text{font-size:30px;line-height:1.3;margin:0 0 18px;word-break:keep-all}
.q-enter{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.progress{margin-bottom:16px}
.progress-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:7px}
.bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--pumpkin));border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px 14px;border-radius:18px;background:var(--card);
  border:2px solid var(--line);box-shadow:var(--shadow);transition:transform .1s,border-color .15s,background .15s}
.pick:active{transform:scale(.96)}
.pick-emoji{font-size:40px;line-height:1}
.pick-name{font-weight:800;font-size:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick.on{border-color:var(--pumpkin);background:var(--pumpkin-l)}
.pick .check{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--pumpkin);color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center;animation:pop .3s}
.pick .tag{position:absolute;top:9px;left:9px;font-size:11px;font-weight:800;color:var(--ink3)}
.vote-hint .ic{color:#4F5C36}
.vote-hint{text-align:center;color:var(--ink2);font-size:14px;margin-top:14px;font-weight:600}
.center{text-align:center}
.big-emoji{font-size:64px;line-height:1;margin-bottom:10px;display:inline-block}
.bob{animation:bob 2.4s ease-in-out infinite}
.wait h2,.lobby h2{font-size:26px;margin:6px 0 8px}
.wait p,.lobby p{margin:0;color:var(--ink2);line-height:1.55}
.sec{font-size:14px;font-weight:800;color:var(--ink2);margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 13px 0 9px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:15px;animation:pop .35s}
.person .e{font-size:20px}

/* Results */
.winner{background:linear-gradient(160deg,#FFF6E3 0%,#FCE3BF 100%);border:2px solid #F0CF92;border-radius:24px;padding:24px 18px 22px;text-align:center;box-shadow:var(--shadow);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.winner .crown{font-size:30px;line-height:1}
.winner .w-emojis{font-size:72px;line-height:1.1;margin:4px 0 8px}
.winner .w-name{font-size:30px;line-height:1.2;word-break:keep-all}
.winner .w-sub{margin-top:8px;font-weight:800;color:#8A5A12}
.rank{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.rank-row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.rank-row .n{font-weight:900;color:var(--ink3);text-align:center}
.rank-row .who{min-width:0}
.rank-row .who b{display:block;font-size:15px;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row .bar{height:8px}
.rank-row .v{font-weight:900;color:var(--pumpkin-d);font-size:15px}

/* Summary */
.board{display:flex;flex-direction:column;gap:8px}
.board-row{display:grid;grid-template-columns:34px 40px 1fr auto;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px}
.board-row.first{background:var(--gold-l);border-color:#F1D9A6}
.board-row .medal{font-size:22px;text-align:center;font-weight:900;color:var(--ink3)}
.board-row .e{font-size:30px;text-align:center}
.board-row b{font-size:16px}
.board-row small{display:block;color:var(--ink3);font-weight:600;font-size:12px;margin-top:2px}
.board-row .trophies{font-weight:900;color:#8A5A12}
.qwin{display:flex;gap:10px;align-items:flex-start;padding:12px 2px;border-bottom:1px dashed var(--line)}
.qwin:last-child{border-bottom:0}
.qwin .qn{font-weight:900;color:var(--pumpkin);min-width:28px}
.qwin .qt{flex:1;font-size:14px;color:var(--ink2);line-height:1.45}
.qwin .qw{display:block;color:var(--ink);font-weight:800;font-size:15px;margin-top:3px}

/* Dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none}
.dock-in{max-width:520px;margin:0 auto;padding:10px 16px calc(12px + env(safe-area-inset-bottom));pointer-events:auto;
  background:linear-gradient(to top,var(--bg) calc(100% - 14px),rgba(251,244,233,0))}
.reacts{display:flex;justify-content:space-between;gap:6px}
.reacts button{flex:1;height:36px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:20px;display:grid;place-items:center;transition:transform .08s}
.reacts button:active{transform:scale(.88)}
.btn svg{flex-shrink:0}

/* Host card */
.hostcard{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.hc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.hc-top b{font-weight:800}
.hc-top small{font-size:12px;font-weight:700;color:var(--ink2);flex-shrink:0}
.hc-top .auto{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:#4F5C36}
.hc-top .auto i{width:8px;height:8px;border-radius:50%;background:#4F5C36}
.hc-dots{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.hc-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.hc-dots i.on{background:var(--pumpkin-d)}
.hc-text{margin:0;font-size:13px;font-weight:500;line-height:1.5}
.hc-wait{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:700;color:var(--ink2)}
.hc-wait span{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px 0 8px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-size:13px;color:var(--ink)}
.hc-row{display:flex;gap:8px}
.hc-side{width:60px;height:56px;flex-shrink:0;border-radius:14px;background:var(--bg);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink2);transition:transform .08s}
.hc-main{flex:1;min-width:0;height:56px;border-radius:14px;background:var(--pumpkin-d);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;text-align:left;transition:transform .08s,filter .15s}
.hc-main:active,.hc-side:active{transform:scale(.97)}
.hc-main.ghost{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.hc-main:disabled{background:var(--bg2);color:var(--ink2);pointer-events:none}
.hc-side:disabled{opacity:.45;pointer-events:none}
.hc-main svg,.hc-side svg{flex-shrink:0}
.hc-main .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hc-main .t b{font-size:16px;font-weight:800;line-height:1.25}
.hc-main .t small{font-size:12px;font-weight:500;line-height:1.3;color:#FFF4EA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-main.ghost .t b{font-size:15px}
.hc-main.ghost .t small,.hc-main:disabled .t small{color:var(--ink2)}
.hc-link{align-self:center;height:44px;padding:0 14px;margin:-6px 0;font-size:13px;font-weight:700;color:var(--ink2);text-decoration:underline}

/* Host lobby & voting finished */
.sec .btn{flex-shrink:0}
.ic-badge{width:44px;height:44px;border-radius:14px;background:var(--pumpkin-l);color:var(--pumpkin-d);display:grid;place-items:center}
.setup h2{font-size:24px;margin:12px 0 6px}
.setup p{margin:0;color:var(--ink2);font-size:14px;line-height:1.55}
.setup .btn.ghost{margin-top:10px;height:44px;font-size:14px}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0;height:48px;padding:0 14px}
.add-row .btn{height:48px;flex-shrink:0;padding:0 16px;font-size:15px;border-radius:12px;background:var(--pumpkin-d)}
.ready-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ready-h h2{font-size:24px;margin:0}
.ready-h .pill{display:inline-flex;align-items:center;gap:4px;color:#4F5C36}
.q-preview{list-style:none;margin:0;padding:0}
.q-preview li{display:flex;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45;word-break:keep-all}
.q-preview b{flex-shrink:0;width:28px;font-weight:800;color:var(--pumpkin-d)}
.ready .more{padding:10px 0 0 38px;font-size:13px;color:var(--ink2)}
.ready .row{margin-top:12px}
.ic-round{width:60px;height:60px;margin:0 auto 10px;border-radius:50%;background:var(--gold-l);color:#7A4E0C;display:grid;place-items:center}
.q-secret{list-style:none;margin:12px 0 0;padding:6px 16px}
.q-secret li{display:flex;align-items:center;gap:8px;min-height:38px;font-size:13px;border-bottom:1px solid var(--line)}
.q-secret li:last-child{border-bottom:0}
.q-secret b{flex-shrink:0;width:28px;font-weight:800;color:var(--pumpkin-d)}
.q-secret span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-secret i{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--bg2);color:var(--ink2);display:grid;place-items:center;font-size:12px;font-weight:800;font-style:normal}

/* Host panel sheet */
.sheet.panel .seg{margin:10px 0 6px;flex-shrink:0}
.panel-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 10px;margin:0 -10px}
.panel-add{flex-shrink:0;border-top:1px solid var(--line);padding:4px 0 calc(12px + env(safe-area-inset-bottom))}
.panel-add .lbl{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.panel-add label{font-size:13px;font-weight:700;color:var(--ink2)}
.panel-add .mini{height:44px;padding:0 4px;font-size:13px;font-weight:700;color:var(--pumpkin-d);display:inline-flex;align-items:center;gap:4px}
.q-meta{display:flex;align-items:center;gap:6px;margin-top:5px}
.q-meta .hint{margin:0}
.row-del{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--cran)}

/* Floating reactions */
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.float{position:absolute;bottom:120px;font-size:34px;animation:floatUp 2.6s ease-out forwards}
@keyframes floatUp{0%{transform:translate(0,0) scale(.6);opacity:0}10%{opacity:1;transform:translate(0,-20px) scale(1.15)}
  100%{transform:translate(var(--dx),-62vh) scale(1);opacity:0}}

/* Sheet & modal */
.scrim{position:fixed;inset:0;background:rgba(43,26,16,.42);z-index:40;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;
  max-height:88dvh;overflow:auto;padding:8px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.2,1)}
.sheet.show{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet-h h3{margin:0;font-size:22px;display:flex;align-items:center;gap:8px}
.sheet section{margin-top:20px}
.sheet h4{margin:0 0 9px;font-size:13px;color:var(--ink2);font-weight:800}
.row{display:flex;gap:8px;margin-top:9px}
.row .btn{flex:1}
.list-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.list-item .t{font-size:14px;font-weight:600;line-height:1.4;word-break:keep-all}
.list-item .acts{display:flex;gap:6px;flex-shrink:0}
.list-item .num{font-weight:900;color:var(--pumpkin);width:24px;flex-shrink:0;font-size:14px}
.list-item.cur{background:var(--pumpkin-l);margin:0 -10px;padding:11px 10px;border-radius:12px;border-bottom-color:transparent}
.menu-btn{display:flex;align-items:center;gap:12px;width:100%;padding:15px 4px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;text-align:left}
.menu-btn:last-child{border-bottom:0}
.menu-btn span{width:26px;display:grid;place-items:center}
.empty{color:var(--ink3);font-size:14px;padding:6px 0}
#qr{display:grid;place-items:center;padding:14px;background:#fff;border-radius:16px;border:1.5px solid var(--line);margin:4px auto 12px;width:max-content}
.share-code{font-size:40px;text-align:center;letter-spacing:.12em;margin:6px 0 2px}
.share-link{font-size:13px;color:var(--ink3);text-align:center;word-break:break-all;margin-bottom:14px}

/* Chat */
.top-acts{display:flex;gap:8px;flex-shrink:0}
.chat-btn{position:relative}
.badge{position:absolute;top:-7px;right:-7px;min-width:21px;height:21px;padding:0 5px;border-radius:11px;background:var(--cran);color:#fff;
  font-size:11px;font-weight:800;line-height:1;display:grid;place-items:center;border:2px solid var(--bg)}
.sheet.chat,.sheet.panel{display:flex;flex-direction:column;height:88dvh;overflow:hidden;padding-bottom:0}
.sheet.chat .sheet-h{margin-bottom:0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.chat-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:3px;padding:8px 2px 12px}
.chat-empty{margin:auto;text-align:center;color:var(--ink3);font-size:14px;line-height:1.6}
.msg{display:flex;flex-direction:column;align-items:flex-start;max-width:84%}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.head{margin-top:10px}
.chat-list>:first-child{margin-top:auto}
.msg.new{animation:pop .25s}
.msg-who{font-size:12px;font-weight:700;color:var(--ink2);margin:0 4px 4px}
.msg-who time{font-weight:600;color:var(--ink3);margin-left:6px}
.msg.me .msg-who time{margin-left:0}
.msg-row{display:flex;align-items:center;gap:6px;max-width:100%}
.msg.me .msg-row{flex-direction:row-reverse}
.bubble{min-width:0;padding:9px 13px;border-radius:18px;background:var(--bg2);font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me .bubble{background:var(--pumpkin);color:#fff}
.msg.pending .bubble{opacity:.55}
.msg-del{flex-shrink:0;width:26px;height:26px;border-radius:50%;font-size:11px;color:var(--ink3);background:var(--bg);border:1px solid var(--line)}
.chat-form{display:flex;gap:8px;padding:10px 0 calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.chat-form input{flex:1;min-width:0;height:46px;padding:0 16px;border-radius:23px}
.chat-form .btn{height:46px;padding:0 18px;border-radius:23px;font-size:15px}

/* Reveal overlay */
#overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(43,26,16,.94);color:#fff;opacity:0;transition:opacity .25s;padding:24px}
#overlay.show{opacity:1}
.rv{text-align:center;max-width:420px}
.rv-q{color:#E9D6BE;font-size:17px;line-height:1.5;margin-bottom:26px;word-break:keep-all}
.drum{font-size:96px;line-height:1;display:inline-block;animation:drum .12s linear infinite}
.rv-t{font-size:34px;margin-top:20px;animation:pulse .5s ease-in-out infinite alternate}
#overlay.light{background:var(--bg);color:var(--ink)}
.iv{width:100%;max-width:380px;text-align:center}
.iv-ic{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;background:var(--sage-l);color:#4F5C36;display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.iv h2{font-size:30px;margin:0 0 8px}
.iv p{margin:0 0 20px;color:var(--ink2);line-height:1.55}
.iv-next{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.iv-next small{display:block;font-size:12px;font-weight:800;color:var(--pumpkin-d);margin-bottom:4px}
.iv-next b{display:block;font-size:16px;line-height:1.4;word-break:keep-all}
.iv-bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.iv-bar i{display:block;width:100%;height:100%;background:var(--pumpkin-d);border-radius:99px;transform-origin:left;animation:ivfill 3s linear both}
@keyframes ivfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:70;display:none}

/* Toast */
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-140%);z-index:80;background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 12px 30px -10px rgba(0,0,0,.4);visibility:hidden;transition:transform .3s cubic-bezier(.2,1.2,.4,1),visibility 0s .3s}
#toast.show{transform:translate(-50%,0);visibility:visible;transition-delay:0s}
.conn{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--cran);color:#fff;text-align:center;font-size:12px;font-weight:700;padding:5px calc(8px + env(safe-area-inset-top)) 5px}

@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes drum{0%{transform:rotate(-9deg) translateY(0)}50%{transform:rotate(9deg) translateY(-6px)}100%{transform:rotate(-9deg) translateY(0)}}
@keyframes pulse{from{opacity:.55;transform:scale(.97)}to{opacity:1;transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (min-width:420px){.picks{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

/* ================= Audio ================= */
let actx = null, noiseBuf = null;
function unlockAudio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const len = Math.floor(actx.sampleRate * 0.1);
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === 'suspended') actx.resume();
  } catch {}
}
document.addEventListener('pointerdown', unlockAudio, { passive: true });
function playDrumroll(dur) {
  if (!soundOn || !actx || !noiseBuf) return;
  const t0 = actx.currentTime + 0.02;
  for (let t = 0; t < dur; t += 0.05) {
    const s = actx.createBufferSource(); s.buffer = noiseBuf;
    const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1100 + Math.random() * 500; f.Q.value = 0.8;
    const g = actx.createGain(); const v = 0.06 + 0.3 * (t / dur);
    g.gain.setValueAtTime(v, t0 + t); g.gain.exponentialRampToValueAtTime(0.0001, t0 + t + 0.045);
    s.connect(f); f.connect(g); g.connect(actx.destination);
    s.start(t0 + t); s.stop(t0 + t + 0.05);
  }
}
function playTada() {
  if (!soundOn || !actx) return;
  const t0 = actx.currentTime + 0.02;
  [523.25, 659.25, 783.99, 1046.5].forEach((fr, i) => {
    const o = actx.createOscillator(); const g = actx.createGain();
    o.type = 'triangle'; o.frequency.value = fr;
    const st = t0 + i * 0.09; const len = i === 3 ? 0.9 : 0.28;
    g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.22, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + len);
    o.connect(g); g.connect(actx.destination); o.start(st); o.stop(st + len + 0.05);
  });
}
function playBlip() {
  if (!soundOn || !actx) return;
  const o = actx.createOscillator(); const g = actx.createGain(); const t = actx.currentTime + 0.01;
  o.type = 'sine'; o.frequency.setValueAtTime(660, t); o.frequency.exponentialRampToValueAtTime(990, t + 0.12);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.3);
}

function floatEmoji(e) {

}
function confetti() {
  const c = $('#confetti'); const ctx = c.getContext('2d');
  const W = innerWidth, H = innerHeight, dpr = window.devicePixelRatio || 1;
  c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ['#E0661B', '#9E2A2B', '#E9A23B', '#6F7F4F', '#F4C27A', '#C8553D'];
  const parts = Array.from({ length: 150 }, () => ({
    x: W / 2 + (Math.random() - 0.5) * 120, y: H * 0.38,
    vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 14 - 5,
    r: Math.random() * 7 + 5, c: colors[Math.floor(Math.random() * colors.length)],
    rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.35, rect: Math.random() < 0.6,
  }));
  const t0 = performance.now(); const DUR = 3400;
  c.style.display = 'block';
  (function frame(now) {
    const t = now - t0;
    ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, 1 - t / DUR); ctx.fillStyle = p.c;
      if (p.rect) ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
      else { ctx.beginPath(); ctx.arc(0, 0, p.r / 2.6, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
    if (t < DUR) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, W, H); c.style.display = 'none'; }
  })(t0);
}
function playReveal(q) {
  const ov = $('#overlay');
  clearTimeout(ovTimer);
  ov.classList.remove('light');
  ov.innerHTML = `<div class="rv"><div class="rv-q">${esc(q.text)}</div><div class="drum">${emo('🥁')}</div><div class="rv-t display">두구두구두구…</div></div>`;
  ov.hidden = false;
  requestAnimationFrame(() => ov.classList.add('show'));
  playDrumroll(2.6);
  vibrate([25, 45, 25, 45, 25, 45, 25, 45, 25]);
  setTimeout(() => {
    ov.classList.remove('show');
    setTimeout(() => { ov.hidden = true; ov.innerHTML = ''; }, 260);
    confetti(); playTada(); vibrate(150);
  }, 2700);
}

// 한 질문의 투표가 끝나고 다음으로 넘어갈 때 잠깐 보여주는 화면
function playInterlude(prev, next) {
  const ov = $('#overlay');
  const all = prev.vote_count >= S.participants.length;
  const box = next
    ? `<small>다음 질문 · Q${S.questions.findIndex((x) => x.id === next.id) + 1}</small><b>${esc(next.text)}</b>`
    : `<small>모든 질문 완료</small><b>이제 결과 발표만 남았어요</b>`;
  ov.innerHTML = `<div class="iv"><div class="iv-ic">${ICON.check(34, 2.6)}</div>
    <h2 class="display">${all ? '모두 투표 완료!' : '투표 종료!'}</h2>
    <p>결과는 모든 질문이 끝난 뒤<br>한꺼번에 공개돼요</p>
    <div class="iv-next">${box}<div class="iv-bar"><i></i></div></div></div>`;
  ov.classList.add('light');
  ov.hidden = false;
  requestAnimationFrame(() => ov.classList.add('show'));
  clearTimeout(ovTimer);
  ovTimer = setTimeout(() => {
    ov.classList.remove('show');

/* ================= Room lifecycle ================= */
function teardownRoom() {
  if (channel) { sb.removeChannel(channel); channel = null; }
  clearInterval(pollTimer); pollTimer = null;
  closeSheet();
  $('#conn').hidden = true;
}
async function enterRoom() {
  teardownRoom();
  firstLoad = true; seenRevealed = new Set(); lastOpenSeen = null;
  Object.assign(S, { room: null, participants: [], questions: [], online: new Set(), myVotes: {}, results: new Map() });
  resetChat();
  S.pending = null; stageHTML = '';
  $('#app').innerHTML = `<div class="wrap"><header class="top" id="hdr"></header><main id="stage"><div class="card center" style="padding:40px">불러오는 중…</div></main></div>`;
  await refresh();
  if (!session) return;
  subscribe();
  pollTimer = setInterval(() => { if (document.visibilityState === 'visible') { refresh(); syncChat(false); } }, 8000);
}
function kicked(msg) {
  const code = session?.code;
  lsDel(LS_SESSION); session = null;
  renderHome(code);
  toast(msg);
}
let refreshing = false, refreshPending = false, refreshTimer = null;
function scheduleRefresh() { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 120); }
async function refresh() {
  if (!session) return;
  if (refreshing) { refreshPending = true; return; }
  refreshing = true;
  try {
    const rid = session.room_id;
    const [r, p, q] = await Promise.all([
      sb.from('rooms').select('*').eq('id', rid).maybeSingle(),
      sb.from('participants').select('id,nickname,emoji,created_at').eq('room_id', rid).order('created_at'),
      sb.from('questions').select('*').eq('room_id', rid).order('sort_order'),
    ]);
    const err = r.error || p.error || q.error;
    if (err) throw err;
    if (!r.data) return kicked('방이 사라졌어요');
    if (!p.data.some((x) => x.id === session.participant_id)) return kicked('방에서 내보내졌어요');
    S.room = r.data; S.participants = p.data; S.questions = q.data;

    if (firstLoad) {
      S.questions.filter((x) => x.status === 'revealed').forEach((x) => seenRevealed.add(x.id));
      const c0 = currentQuestion();
      if (c0 && c0.status === 'open') lastOpenSeen = c0.id;
    }
    const cur = currentQuestion();
    if (cur && cur.status === 'open') {
      S.myVotes[cur.id] = await rpc('my_vote', { p_token: session.token, p_question_id: cur.id });
    }
    let pending = null;
    if (cur && cur.status === 'open' && isHost()) {
      try { pending = new Set(await rpc('host_pending_voters', { p_token: session.token })); } catch (e) { console.error(e); }
    }
    S.pending = pending;
    if (S.questions.some((x) => x.status === 'revealed')) {
      const rows = await rpc('get_revealed_results', { p_room_id: rid });
      const m = new Map();
      for (const row of rows || []) {
        if (!m.has(row.question_id)) m.set(row.question_id, new Map());
        m.get(row.question_id).set(row.target_id, row.votes);
      }
      S.results = m;
    } else S.results = new Map();
    render();
    firstLoad = false;
  } catch (e) {
    console.error(e);
    if (String(e?.message || '').includes('INVALID_SESSION')) return kicked(ERRORS.INVALID_SESSION);
  } finally {
    refreshing = false;
    if (refreshPending) { refreshPending = false; scheduleRefresh(); }
  }
}
function subscribe() {
  const rid = session.room_id;
  channel = sb.channel('room-' + rid, { config: { presence: { key: session.participant_id }, broadcast: { self: true } } });
  channel
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms', filter: 'id=eq.' + rid }, scheduleRefresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'questions', filter: 'room_id=eq.' + rid }, scheduleRefresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'participants', filter: 'room_id=eq.' + rid }, scheduleRefresh)
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'participants' }, scheduleRefresh)
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'questions' }, scheduleRefresh)
    .on('presence', { event: 'sync' }, () => {
      S.online = new Set(Object.keys(channel.presenceState()));
      if (S.room) { renderHeader(); if (S.room.phase === 'lobby' || !currentQuestion()) renderStage(); if (sheetKind === 'host') renderHostLists(); }
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room_id=eq.' + rid }, (p) => onChatInsert(p.new))
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, (p) => onChatDelete(p.old?.id))
    .on('broadcast', { event: 'react' }, ({ payload }) => floatEmoji(payload?.e))
    .subscribe(async (status) => {
      $('#conn').hidden = status === 'SUBSCRIBED' || !session;
      if (status === 'SUBSCRIBED') {
        await channel.track({ at: Date.now() });
        scheduleRefresh();
        syncChat(true);
      }
    });
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && session) { scheduleRefresh(); syncChat(true); } });

/* ================= Render: room ================= */
function render() {
  if (!S.room) return;
  renderHeader();
  renderStage();
  renderDock();
  if (sheetKind === 'host') renderHostLists();
  if (sheetKind === 'menu') renderMenu();
  if (sheetKind === 'chat') renderChatList();

  const cur = currentQuestion(), ph = S.room.phase;
  const openId = ph === 'question' && cur && cur.status === 'open' ? cur.id : null;
  if (openId !== lastOpenSeen) {
    const prev = lastOpenSeen && S.questions.find((q) => q.id === lastOpenSeen);
    if (!firstLoad) {
      // 보던 질문이 끝나고 다음 질문(또는 투표 종료)으로 넘어간 경우
      if (prev && prev.status === 'closed' && (openId || ph === 'finished')) playInterlude(prev, openId ? cur : null);
      if (openId) { vibrate(80); playBlip(); $('#stage .q-text')?.classList.add('q-enter'); }
    }
    lastOpenSeen = openId;
  }
  if (cur && cur.status === 'revealed' && (ph === 'question' || ph === 'results') && !seenRevealed.has(cur.id)) {
    seenRevealed.add(cur.id);
    if (!firstLoad) playReveal(cur);
  }
}

function statusPill(s, inList) {

function finishedHTML() {

function tallyFor(qid) {
  const m = S.results.get(qid) || new Map();
  return S.participants
    .map((p) => ({ p, v: m.get(p.id) || 0 }))
    .filter((r) => r.v > 0)
    .sort((a, b) => b.v - a.v || a.p.nickname.localeCompare(b.p.nickname, 'ko'));
}
function resultsHTML(q) {
  const rows = tallyFor(q.id);
  if (!rows.length) return `<div class="card center wait"><div class="big-emoji">${emo('🤷')}</div><h2 class="display">아무도 투표하지 않았어요</h2></div>`;
  const top = rows[0].v;
  const winners = rows.filter((r) => r.v === top);
  const tie = winners.length > 1;
  const winner = `
    <div class="winner">
      <div class="crown">${emo('👑')}</div>
      <div class="w-emojis">${winners.map((w) => emo(w.p.emoji)).join(' ')}</div>
      <div class="w-name display">${winners.map((w) => esc(w.p.nickname)).join(', ')}</div>
      <div class="w-sub">${tie ? '공동 1위 · ' : ''}${top}표</div>
    </div>`;
  let rank = 0, prev = null;
  const list = rows.map((r, i) => {
    if (r.v !== prev) { rank = i + 1; prev = r.v; }
    return `
      <div class="rank-row">
        <span class="n">${rank}</span>
        <div class="who"><b>${emo(r.p.emoji)} ${esc(r.p.nickname)}</b><div class="bar"><i style="width:${Math.round((r.v / top) * 100)}%"></i></div></div>
        <span class="v">${r.v}표</span>
      </div>`;
  }).join('');
  return winner + `<div class="rank">${list}</div>`;
}
function summaryHTML() {
  const revealed = S.questions.filter((q) => q.status === 'revealed');
  if (!revealed.length) {
    return `<div class="card center wait"><div class="big-emoji">${emo('🏆')}</div><h2 class="display">최종 결과</h2><p>아직 공개된 결과가 없어요</p></div>`;
  }
  const stats = new Map(S.participants.map((p) => [p.id, { p, wins: 0, votes: 0 }]));
  const perQ = revealed.map((q) => {
    const rows = tallyFor(q.id);
    const top = rows[0]?.v || 0;
    const w = rows.filter((r) => r.v === top && top > 0);
    w.forEach((r) => stats.get(r.p.id) && stats.get(r.p.id).wins++);
    rows.forEach((r) => stats.get(r.p.id) && (stats.get(r.p.id).votes += r.v));
    return { q, w, top };
  });
  const board = [...stats.values()].sort((a, b) => b.wins - a.wins || b.votes - a.votes || a.p.nickname.localeCompare(b.p.nickname, 'ko'));
  const medals = ['🥇', '🥈', '🥉'].map(emo);
  let rank = 0, prevKey = null;
  const boardHTML = board.map((s, i) => {
    const key = s.wins + ':' + s.votes;
    if (key !== prevKey) { rank = i; prevKey = key; }
    return `
      <div class="board-row ${rank === 0 && s.wins > 0 ? 'first' : ''}">
        <span class="medal">${rank < 3 && s.votes > 0 ? medals[rank] : rank + 1}</span>
        <span class="e">${emo(s.p.emoji)}</span>
        <div><b>${esc(s.p.nickname)}</b><small>총 ${s.votes}표 받음</small></div>
        <span class="trophies">${s.wins ? emo('🏆') + '×' + s.wins : ''}</span>
      </div>`;
  }).join('');
  const qList = perQ.map(({ q, w, top }) => {
    const n = S.questions.findIndex((x) => x.id === q.id) + 1;
    const who = w.length ? w.map((r) => emo(r.p.emoji) + ' ' + esc(r.p.nickname)).join(', ') + ` · ${top}표` : '투표 없음';
    return `<div class="qwin"><span class="qn">Q${n}</span><span class="qt">${esc(q.text)}<span class="qw">${who}</span></span></div>`;
  }).join('');
  return `
    <div class="center" style="margin:4px 0 18px"><div class="big-emoji bob">${emo('🏆')}</div><h2 class="display" style="font-size:30px;margin:4px 0 0">오늘의 최종 결과</h2></div>
    <div class="board">${boardHTML}</div>
    <div class="sec"><span>질문별 수상자</span></div>
    <div class="card" style="padding:6px 16px">${qList}</div>`;
}
function nextDraft() {
  const drafts = S.questions.filter((q) => q.status === 'draft');
  if (!drafts.length) return null;
  const cur = currentQuestion();
  if (cur) { const after = drafts.find((q) => q.sort_order > cur.sort_order); if (after) return after; }
  return drafts[0];
}
// 호스트 전용 진행 카드: 지금 할 일 하나만 큰 버튼으로 보여준다
function hostCardHTML() {
  const cur = currentQuestion(), ph = S.room.phase, n = S.participants.length;
  const qno = (q) => S.questions.findIndex((x) => x.id === q.id) + 1;
  const label = (q) => `Q${qno(q)}. ${esc(q.text)}`;
  const side = (action, icon, text, off) => `<button class="hc-side" data-action="${action}"${off ? ' disabled' : ''}>${icon}${text}</button>`;
  const main = (o) => `<button class="hc-main${o.ghost ? ' ghost' : ''}"${o.action ? ` data-action="${o.action}"` : ' disabled'}${o.attrs || ''}>${o.icon || ''}<span class="t"><b>${o.title}</b><small>${o.sub}</small></span>${o.action && !o.ghost ? ICON.chevR(18, 2.4) : ''}</button>`;
  const list = side('host-panel', ICON.list(20), '질문 목록');
  const next = nextDraft();
  const done = S.questions.filter((q) => q.status === 'closed' || q.status === 'revealed'); // 투표가 끝난 질문 (발표 순서)
  const unrevealed = done.filter((q) => q.status === 'closed');
  let top, body = '', row, extra = '';

  if (ph === 'question' && cur && cur.status === 'open') {
    const left = Math.max(0, n - cur.vote_count);
    top = `<span class="auto"><i></i>자동 진행 중</span>`;
    body = `<p class="hc-text">${n}명이 모두 투표하면 ${next ? '다음 질문으로 자동으로 넘어가요' : '투표가 끝나고 결과 발표를 시작할 수 있어요'}.</p>`;
    const pend = S.pending ? S.participants.filter((p) => S.pending.has(p.id)) : [];
    if (pend.length) {
      body += `<div class="hc-wait">아직 투표 안 함${pend.slice(0, 6).map((p) => `<span>${emo(p.emoji)} ${esc(p.nickname)}</span>`).join('')}${pend.length > 6 ? `<span>+${pend.length - 6}</span>` : ''}</div>`;
    }
    row = list + main({ ghost: true, action: 'host-skip', icon: ICON.skip(22), title: '기다리지 않고 넘기기', sub: left ? `안 한 ${left}명은 이 질문을 건너뛰어요` : '바로 다음으로 넘어가요' });
  } else if (ph === 'results') {
    const i = cur ? done.findIndex((q) => q.id === cur.id) : -1;
    const nx = done[i + 1];
    const dots = done.length <= 12 ? `<span class="hc-dots" aria-hidden="true">${done.map((_, k) => `<i${k <= i ? ' class="on"' : ''}></i>`).join('')}</span>` : '';
    top = `<span><b>결과 발표 ${i + 1} / ${done.length}</b>${dots}</span>`;
    row = side('host-prev-result', ICON.chevL(20, 2.2), '이전 결과', i <= 0)
      + (nx ? main({ action: 'host-next-result', title: '다음 결과 공개', sub: label(nx) })
            : main({ action: 'host-next-result', icon: ICON.trophy(22), title: '최종 순위 보기', sub: '모든 결과를 모아서 보여줘요' }));
  } else if (ph === 'summary') {
    top = `<b>최종 결과</b>`;
    row = side('host-prev-result', ICON.chevL(20, 2.2), '결과 다시', !done.some((q) => q.status === 'revealed'))
      + main({ ghost: true, action: 'host-phase', attrs: ' data-p="lobby"', title: '대기실로 돌아가기', sub: '질문을 추가해 한 판 더 할 수 있어요' });
  } else {
    const started = S.questions.some((q) => q.status !== 'draft');
    top = ph === 'finished'
      ? `<b>투표 종료 · 질문 ${unrevealed.length}개 · ${n}명 참여</b>`
      : `<b>${started ? '쉬는 중' : '시작 전'} · 질문 ${S.questions.length}개 · ${n}명 입장</b>`;
    if (next) {
      row = list + main({ action: 'host-start', icon: ICON.play(22), title: ph === 'finished' ? '추가 질문 시작' : started ? '다음 질문 시작' : '첫 질문 시작', sub: label(next) });
      if (unrevealed.length) extra = `<button class="hc-link" data-action="host-next-result">남은 질문 없이 결과 발표 시작</button>`;
    } else if (unrevealed.length) {
      row = list + main({ action: 'host-next-result', icon: ICON.play(22), title: '결과 발표 시작', sub: `Q${qno(unrevealed[0])}부터 하나씩 공개해요` });
    } else {
      row = list + main({ icon: ICON.play(22), title: started ? '다음 질문 시작' : '첫 질문 시작', sub: '질문을 추가하면 시작할 수 있어요' });
    }
  }
  return `<div class="hostcard"><div class="hc-top">${top}<small>호스트 전용</small></div>${body}<div class="hc-row">${row}</div>${extra}</div>`;
}

function openSheet(kind, html) {

  sh.style.height = sh.style.bottom = '';

function closeSheet() {

}

  const next = nextDraft();
  list.innerHTML = S.questions.length ? S.questions.map((q, i) => {
    const meta = q.status === 'open' ? `${q.vote_count}/${n}명 투표`
      : q.status === 'closed' ? '결과는 마지막에 공개'
      : next && q.id === next.id ? '다음 차례' : '';
    const del = q.status === 'draft'
      ? `<div class="acts"><button class="row-del" data-action="host-delete-q" data-q="${q.id}" aria-label="Q${i + 1} 삭제">${ICON.trash(18)}</button></div>` : '';
    return `
      <div class="list-item ${q.status === 'open' ? 'cur' : ''}">
        <span class="num">Q${i + 1}</span>
        <div class="grow"><div class="t">${esc(q.text)}</div><div class="q-meta">${statusPill(q.status, true)}${meta ? `<span class="hint">${meta}</span>` : ''}</div></div>
        ${del}
      </div>`;
  }).join('') : `<div class="empty">아직 질문이 없어요. 아래에서 추가해 주세요.</div>`;
  if (panelToBottom) { panelToBottom = false; list.scrollTop = list.scrollHeight; }
}
async function addQuestion(form) {
  const inp = form.querySelector('input'), btn = form.querySelector('button[type=submit]');
  const text = inp.value.trim();
  if (!text) return toast('질문을 입력해주세요');
  btn.disabled = true;
  try {
    await rpc('host_add_questions', { p_token: session.token, p_texts: [text] });
    inp.value = '';
    if (document.contains(inp)) inp.focus();
    toast('질문을 추가했어요');
    panelToBottom = true;
    scheduleRefresh();
  } catch (err) { toast(errMsg(err)); }
  finally { btn.disabled = false; }
}
async function hostRpc(el, name) {
  el.disabled = true; // 다음 화면이 그려질 때까지 중복 탭 방지
  try { await rpc(name, { p_token: session.token }); scheduleRefresh(); }
  catch (err) { el.disabled = false; toast(errMsg(err)); scheduleRefresh(); }
}
function openMenu() { openSheet('menu', '<div id="menu-body"></div>'); renderMenu(); }
function renderMenu() {
  const body = $('#menu-body'); if (!body) return;
  const m = me();
  body.innerHTML = `
    <div class="sheet-h"><h3 class="display">${m ? emo(m.emoji) + esc(m.nickname) : '메뉴'}</h3><button class="icon-btn" data-action="close-sheet" aria-label="닫기">${ICON.x(18, 2.4)}</button></div>
    <section style="margin-top:8px">
      <button class="menu-btn" data-action="share"><span>${ICON.link(20)}</span>친구 초대 (QR · 링크)</button>
      <button class="menu-btn" data-action="toggle-sound"><span>${soundOn ? ICON.sound(20) : ICON.mute(20)}</span>효과음 ${soundOn ? '켜짐' : '꺼짐'}</button>
      ${isHost() ? `<button class="menu-btn" data-action="host-panel"><span>${ICON.list(20)}</span>진행 관리 (질문 · 참가자)</button>` : `<button class="menu-btn" data-action="claim-host"><span>${ICON.crown(20)}</span>호스트 권한 가져오기</button>`}
      <button class="menu-btn" data-action="leave" style="color:var(--cran)"><span>${ICON.exit(20)}</span>이 기기에서 방 나가기</button>
    </section>`;
}
function openShare() {
  const url = shareUrl();
  openSheet('share', `
    <div class="sheet-h"><h3 class="display">친구 초대</h3><button class="icon-btn" data-action="close-sheet" aria-label="닫기">${ICON.x(18, 2.4)}</button></div>
    <div class="share-code display">${esc(session.code)}</div>
    <div class="share-link">${esc(url)}</div>
    <div id="qr"></div>
    <div class="row">
      <button class="btn ghost" data-action="copy-link">링크 복사</button>

}
function openClaimHost() {
  openSheet('claim', `
    <div class="sheet-h"><h3 class="display">호스트 권한 가져오기</h3><button class="icon-btn" data-action="close-sheet" aria-label="닫기">${ICON.x(18, 2.4)}</button></div>
    <p style="color:var(--ink2);margin:6px 0 4px;line-height:1.5">방을 만들 때 정한 호스트 PIN을 입력하면 이 기기가 호스트가 돼요.</p>
    <form id="f-claim">
      <label class="f" for="claim-pin">호스트 PIN</label>
      <input id="claim-pin" type="password" inputmode="numeric" maxlength="8">

  $('#f-claim').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {

      closeSheet(); toast('이제 호스트예요!'); refresh();
    } catch (err) { toast(errMsg(err)); }

  setTimeout(() => $('#claim-pin')?.focus(), 300);
}

/* ================= Chat ================= */
const lastMsgId = () => (chat.msgs.length ? chat.msgs[chat.msgs.length - 1].id : 0);
const fmtTime = (d) => d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
function resetChat() {
  Object.assign(chat, { msgs: [], pending: [], lastRead: 0, hasRead: false, loaded: false, shownMax: 0 });
  try {
    const r = JSON.parse(lsGet(LS_CHAT_READ) || 'null');
    if (r && r.room === session.room_id) { chat.lastRead = Number(r.id) || 0; chat.hasRead = true; }
  } catch {}
}
function chatUnread() {
  const mine = session?.participant_id;
  return chat.msgs.reduce((n, m) => n + (m.id > chat.lastRead && m.participant_id !== mine ? 1 : 0), 0);
}
function putMsg(row) {
  const id = Number(row?.id);
  if (!id || chat.msgs.some((m) => m.id === id)) return false;
  chat.msgs.push({ id, participant_id: row.participant_id, text: row.text, created_at: row.created_at });
  if (chat.msgs.length > 1 && chat.msgs[chat.msgs.length - 2].id > id) chat.msgs.sort((a, b) => a.id - b.id);
  if (chat.msgs.length > CHAT_MAX) chat.msgs.splice(0, chat.msgs.length - CHAT_MAX);
  return true;
}
function dropPending(tmp) { chat.pending = chat.pending.filter((m) => m !== tmp); }
// full: 최근 메시지를 통째로 다시 받아 삭제분까지 맞춤 / 아니면 마지막 id 이후만
async function syncChat(full) {
  if (!session) return;
  if (chatBusy) { chatQueued = Math.max(chatQueued, full ? 2 : 1); return; }
  chatBusy = true;
  const rid = session.room_id;
  try {
    const whole = full || !chat.loaded;
    let q = sb.from('messages').select('id,participant_id,text,created_at').eq('room_id', rid);
    q = whole ? q.order('id', { ascending: false }).limit(CHAT_MAX) : q.gt('id', lastMsgId()).order('id').limit(CHAT_MAX);
    const { data, error } = await q;
    if (error) throw error;
    if (session?.room_id !== rid) return;
    if (whole) {
      const rows = data.reverse().map((r) => ({ ...r, id: Number(r.id) }));
      const top = rows.length ? rows[rows.length - 1].id : 0;
      chat.msgs = rows.concat(chat.msgs.filter((m) => m.id > top)); // 받는 사이 실시간으로 도착한 것 유지
      if (!chat.loaded) {
        chat.loaded = true;
        if (!chat.hasRead) chat.lastRead = lastMsgId(); // 처음 입장: 기존 대화는 읽은 것으로
      }
    } else data.forEach(putMsg);
    chatChanged();
  } catch (e) { console.error(e); }
  finally {
    chatBusy = false;
    if (chatQueued) { const f = chatQueued === 2; chatQueued = 0; syncChat(f); }
  }
}
function onChatInsert(row) {
  if (!row || !session) return;
  if (row.participant_id === session.participant_id) {
    const i = chat.pending.findIndex((m) => m.text === row.text);
    if (i >= 0) chat.pending.splice(i, 1);
  }
  putMsg(row);
  if (!S.participants.some((p) => p.id === row.participant_id)) scheduleRefresh();
  chatChanged();
}
function onChatDelete(id) {
  id = Number(id);
  if (!chat.msgs.some((m) => m.id === id)) return;
  chat.msgs = chat.msgs.filter((m) => m.id !== id);
  chatChanged();
}
function chatChanged(stick) {
  if (sheetKind === 'chat') { renderChatList(stick); markChatRead(); }
  else if (S.room && $('#hdr')) renderHeader();
}
function markChatRead() {
  const last = lastMsgId();
  if (last > chat.lastRead) {
    chat.lastRead = last;
    lsSet(LS_CHAT_READ, JSON.stringify({ room: session.room_id, id: last }));
  }
  chat.hasRead = true;
  if (S.room && $('#hdr')) renderHeader();
}
function renderChatList(stick) {
  const box = $('#chat-list'); if (!box) return;
  const atBottom = stick || box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const byId = new Map(S.participants.map((p) => [p.id, p]));
  const mine = session.participant_id, host = isHost();
  let prev = null, html = '';
  for (const m of chat.msgs.concat(chat.pending)) {
    const isMe = m.participant_id === mine;
    const t = new Date(m.created_at);
    const head = !prev || prev.participant_id !== m.participant_id || t - new Date(prev.created_at) > 5 * 60000;
    const p = byId.get(m.participant_id);
    const who = head ? `<div class="msg-who">${isMe ? '' : p ? emo(p.emoji) + ' ' + esc(p.nickname) : '나간 참가자'}<time>${fmtTime(t)}</time></div>` : '';
    const del = host && m.id ? `<button class="msg-del" data-action="chat-delete" data-id="${m.id}" aria-label="메시지 삭제">${ICON.x(12, 2.8)}</button>` : '';
    const cls = 'msg' + (isMe ? ' me' : '') + (head ? ' head' : '') + (m.pending ? ' pending' : '') + (!isMe && m.id > chat.shownMax ? ' new' : '');
    html += `<div class="${cls}">${who}<div class="msg-row"><div class="bubble">${esc(m.text)}</div>${del}</div></div>`;
    prev = m;
  }
  box.innerHTML = html || `<div class="chat-empty">아직 메시지가 없어요<br>첫 마디를 남겨보세요</div>`;
  chat.shownMax = Math.max(chat.shownMax, lastMsgId());
  if (atBottom) box.scrollTop = box.scrollHeight;
}
function openChat() {
  openSheet('chat', `
    <div class="sheet-h"><h3 class="display">${ICON.chat(22)}채팅</h3><button class="icon-btn" data-action="close-sheet" aria-label="닫기">${ICON.x(18, 2.4)}</button></div>
    <div id="chat-list" class="chat-list" aria-live="polite"></div>
    <form id="chat-form" class="chat-form" autocomplete="off">
      <input id="chat-input" maxlength="200" placeholder="메시지 보내기" enterkeyhint="send" autocomplete="off" aria-label="메시지">
      <button class="btn" type="submit">보내기</button>
    </form>`);
  chat.shownMax = lastMsgId(); // 이미 와 있던 메시지는 등장 애니메이션 없이
  renderChatList(true);
  markChatRead();
  $('#chat-form').addEventListener('submit', (e) => { e.preventDefault(); sendChat(); });
  // 보내기 버튼을 눌러도 입력창 포커스(모바일 키보드)가 유지되도록
  const keep = (e) => e.preventDefault();
  $('#chat-form .btn').addEventListener('pointerdown', keep);
  $('#chat-form .btn').addEventListener('mousedown', keep);
  fitSheet();
  if (!chat.loaded) syncChat(true);
  if (matchMedia('(pointer:fine)').matches) setTimeout(() => $('#chat-input')?.focus(), 300);
}
async function sendChat() {
  const inp = $('#chat-input'); if (!inp || !session) return;
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  const rid = session.room_id;
  const tmp = { tmp: ++chatTmp, participant_id: session.participant_id, text, created_at: new Date().toISOString(), pending: true };
  chat.pending.push(tmp);
  chatChanged(true);
  try {
    const res = await rpc('send_message', { p_token: session.token, p_text: text });
    if (session?.room_id !== rid) return;
    dropPending(tmp);
    putMsg({ id: res.id, participant_id: tmp.participant_id, text, created_at: res.created_at });
  } catch (err) {
    if (session?.room_id !== rid) return;
    dropPending(tmp);
    const cur = $('#chat-input');
    if (cur && !cur.value) cur.value = text; // 실패하면 쓴 글을 돌려줌
    toast(errMsg(err));
    if (String(err?.message || '').includes('INVALID_SESSION')) scheduleRefresh();
  }
  chatChanged(true);
}
// 모바일 키보드가 올라오면 시트를 키보드 위로 올리고 높이를 보이는 영역에 맞춤 (입력창이 있는 채팅·진행 관리 시트)
function fitSheet() {
  const vv = window.visualViewport;
  if ((sheetKind !== 'chat' && sheetKind !== 'host') || !vv || vv.scale > 1.01) return;
  const sh = $('#sheet'), box = $('#chat-list');
  const stick = box && box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  sh.style.bottom = kb > 1 ? kb + 'px' : '';
  sh.style.height = kb > 1 ? Math.min(vv.height - 8, window.innerHeight * 0.88) + 'px' : '';
  if (stick) box.scrollTop = box.scrollHeight;
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', fitSheet);
  visualViewport.addEventListener('scroll', fitSheet);
}

/* ================= Actions ================= */
let lastReact = 0;
const actions = {
  tab(el) {
    const t = el.dataset.tab;
    document.querySelectorAll('.seg button').forEach((b) => b.classList.toggle('on', b === el));
    $('#f-join').hidden = t !== 'join';
    $('#f-create').hidden = t !== 'create';
  },
  'pick-emoji'(el) {
    const grid = el.closest('.emoji-grid');
    grid.dataset.value = el.dataset.e;
    grid.querySelectorAll('button').forEach((b) => { b.classList.toggle('on', b === el); b.setAttribute('aria-pressed', b === el); });
  },
  'back-to-room'() {
    const s = loadSession(); if (!s) return;
    session = s;
    history.replaceState(null, '', location.pathname + '?code=' + s.code);
    enterRoom();
  },
  async vote(el) {
    const cur = currentQuestion();
    if (!cur || cur.status !== 'open') return;
    const target = el.dataset.id;
    const prev = S.myVotes[cur.id];
    if (prev === target) return;
    S.myVotes[cur.id] = target;
    renderStage(); vibrate(15);
    try {
      await rpc('cast_vote', { p_token: session.token, p_question_id: cur.id, p_target_id: target });
    } catch (err) {
      S.myVotes[cur.id] = prev; renderStage(); toast(errMsg(err)); scheduleRefresh();
    }
  },
  react(el) {
    const now = Date.now();
    if (now - lastReact < 250 || !channel) return;
    lastReact = now;
    channel.send({ type: 'broadcast', event: 'react', payload: { e: el.dataset.e } });
  },
  menu: openMenu,
  share: openShare,
  chat: openChat,
  async 'chat-delete'(el) {
    const id = Number(el.dataset.id);
    if (!confirm('이 메시지를 삭제할까요?')) return;
    try { await rpc('host_delete_message', { p_token: session.token, p_message_id: id }); onChatDelete(id); }
    catch (err) { toast(errMsg(err)); }
  },
  'close-sheet': closeSheet,
  'host-panel': openHostPanel,
  'claim-host': openClaimHost,
  async 'copy-link'() {
    try { await navigator.clipboard.writeText(shareUrl()); toast('링크를 복사했어요'); }
    catch { toast('복사에 실패했어요. 링크를 길게 눌러 복사해주세요'); }
  },
  async 'native-share'() {
    try { await navigator.share({ title: S.room?.name || '김김이홍남원 어워즈', text: '투표하러 와!', url: shareUrl() }); } catch {}
  },
  'toggle-sound'() {
    soundOn = !soundOn; lsSet(LS_SOUND, soundOn ? 'on' : 'off');
    if (soundOn) { unlockAudio(); playBlip(); }
    renderMenu();
  },
  leave() {
    if (!confirm('이 기기에서 방을 나갈까요?\n같은 닉네임으로 다시 들어오려면 호스트가 기존 닉네임을 내보내야 해요.')) return;
    const code = session.code;
    lsDel(LS_SESSION); session = null;
    renderHome(code);
  },
  'host-tab'(el) { hostTab = el.dataset.tab; renderHostLists(); },
  'host-start'(el) { return hostRpc(el, 'host_start'); },
  'host-skip'(el) {
    const cur = currentQuestion();
    const left = cur ? Math.max(0, S.participants.length - cur.vote_count) : 0;
    if (left && !confirm(`아직 ${left}명이 투표하지 않았어요.\n기다리지 않고 넘어갈까요?`)) return;
    return hostRpc(el, 'host_skip');
  },
  'host-next-result'(el) { return hostRpc(el, 'host_results_next'); },
  'host-prev-result'(el) { return hostRpc(el, 'host_results_prev'); },
  async 'host-phase'(el) {
    if (el.dataset.p === 'summary' && S.questions.some((q) => q.status === 'open') && !confirm('진행 중인 투표를 마감하고 최종 결과로 넘어갈까요?')) return;
    try { await rpc('host_set_phase', { p_token: session.token, p_phase: el.dataset.p }); if (sheetKind === 'host') closeSheet(); scheduleRefresh(); }
    catch (err) { toast(errMsg(err)); }
  },
  async 'host-delete-q'(el) {
    const q = S.questions.find((x) => x.id === el.dataset.q);
    if (!q || !confirm(`이 질문을 삭제할까요?\n"${q.text}"`)) return;
    try { await rpc('host_delete_question', { p_token: session.token, p_question_id: q.id }); scheduleRefresh(); }
    catch (err) { toast(errMsg(err)); }
  },
  async 'host-remove-p'(el) {
    const p = S.participants.find((x) => x.id === el.dataset.id);
    if (!p || !confirm(`${p.nickname}님을 내보낼까요?\n이 사람의 투표와 받은 표도 함께 사라져요.`)) return;
    try { await rpc('host_remove_participant', { p_token: session.token, p_participant_id: p.id }); scheduleRefresh(); }
    catch (err) { toast(errMsg(err)); }
  },
  async 'sample-questions'(el) {
    const add = missingSamples();
    if (!add.length) return toast('예시 질문이 이미 모두 들어 있어요');
    el.disabled = true;
    try {
      await rpc('host_add_questions', { p_token: session.token, p_texts: add });
      toast(`예시 질문 ${add.length}개를 추가했어요`);
      panelToBottom = true;
      scheduleRefresh();
    } catch (err) { toast(errMsg(err)); }
    finally { el.disabled = false; }
  },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = actions[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});

document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form="add-q"]');
  if (f) { e.preventDefault(); addQuestion(f); }
});

/* ================= Boot ================= */
(async function boot() {
  const urlCode = (new URLSearchParams(location.search).get('code') || '').toUpperCase();
  const saved = loadSession();
  if (saved && (!urlCode || urlCode === saved.code)) {
    try {
      await rpc('whoami', { p_token: saved.token });
      session = saved;
      if (!urlCode) history.replaceState(null, '', location.pathname + '?code=' + saved.code);
      return enterRoom();
    } catch (e) {
      if (String(e?.message || '').includes('INVALID_SESSION')) lsDel(LS_SESSION);
      else { session = saved; return enterRoom(); } // 네트워크 오류면 세션 유지
    }
  }
  renderHome(urlCode);
})();
</script>
